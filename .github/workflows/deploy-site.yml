name: Deploy site

# Builds the static site from whatever data is committed and publishes it to
# GitHub Pages. Separate from the scoring run on purpose:
#
#   * the first deploy needs no 40-minute data run - the data is in the repo;
#   * the monthly run pushes new data to main, which triggers this;
#   * only one workflow ever deploys, so two runs cannot race for Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: rankfield-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on via the API, so there is no manual
      # Settings step before the first deploy.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Unit tests
        working-directory: site
        # A broken display layer must not reach the live site.
        run: |
          npm ci
          npm test

      - name: Build
        working-directory: site
        env:
          # A project page is served from /<repo>/, so the asset base must match
          # or every script and stylesheet 404s. `configure-pages` reports the
          # real base path; the repo name is the fallback.
          RANKFIELD_BASE: ${{ vars.RANKFIELD_BASE || steps.pages.outputs.base_path || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Verify the build serves its payloads under the deployed path
        working-directory: site
        run: |
          test -f dist/data/scores_full.json || { echo "scores_full.json missing from the build"; exit 1; }
          test -f dist/data/scores_public.json || { echo "scores_public.json missing from the build"; exit 1; }

          # A base path without a trailing slash concatenates into
          # "/<repo>data/..." and 404s every payload at runtime, while the
          # assets still load because Vite joins those separately. That failure
          # is invisible in the build log, so assert the normalised base is what
          # actually got compiled in.
          base=$(grep -oE '"/[A-Za-z0-9_.-]+/"' dist/assets/*.js | sort -u | head -1)
          echo "compiled base: $base"
          grep -qE '"/[A-Za-z0-9_.-]+/"|"/"' dist/assets/*.js             || { echo "no trailing-slash base found in the bundle"; exit 1; }

          # End-to-end: serve dist exactly as a project page does and fetch both
          # the shell and a payload by their real URLs.
          repo='${{ github.event.repository.name }}'
          mkdir -p /tmp/pages/"$repo"
          cp -r dist/. /tmp/pages/"$repo"/
          (cd /tmp/pages && python3 -m http.server 8099 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -fsS "http://localhost:8099/$repo/" -o /dev/null && break; sleep 1; done
          curl -fsS "http://localhost:8099/$repo/" -o /dev/null
          curl -fsS "http://localhost:8099/$repo/data/scores_full.json" -o /dev/null
          echo "shell and payload both serve under /$repo/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the live URL
        run: |
          echo "### Rankfield is live" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
