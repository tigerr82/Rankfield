name: Monthly score

# Scoring date is the last trading day of the prior month; the run happens on
# the 2nd at 06:00 UTC to give the sources a day to settle.
#
# A missed month is a permanent hole in history - there is no external source to
# reconstruct past Rankfield scores from - so the job retries rather than
# skipping, and history files are append-only.
#
# This workflow does not deploy. It pushes the new data to main, which triggers
# deploy-site.yml; keeping one deploying workflow stops two runs racing for
# Pages.
on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Scoring date override (YYYY-MM-DD)"
        required: false
      limit:
        # Keep this short: GitHub renders the description as the field's only
        # label, so a long one reads as body text and the input looks unlabelled.
        description: "Limit — cap universe size (validation run, skips the data commit)"
        required: false
        default: ""

concurrency:
  group: rankfield-score
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Scoring engine tests
        # History is append-only: a scoring bug that reaches it cannot be undone
        # by fixing the code later. Gate the run on the maths first.
        run: python -m pytest tests/ -q

      - name: Check the SEC contact secret
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        # Fail here with a clear message rather than 40 minutes later with an
        # opaque EDGAR rejection. The value itself is never printed.
        run: |
          if [ -z "$RANKFIELD_USER_AGENT" ]; then
            echo "::error::RANKFIELD_USER_AGENT repository secret is not set. SEC policy requires a User-Agent carrying a real name and email address."
            exit 1
          fi
          case "$RANKFIELD_USER_AGENT" in
            *@*.*) echo "SEC contact is configured and contains an email address (value masked).";;
            *) echo "::error::RANKFIELD_USER_AGENT must contain an email address."; exit 1;;
          esac

      # SEC policy requires a User-Agent carrying a real name and email.
      # Set the RANKFIELD_USER_AGENT repository secret before the first run.
      - name: Fetch universe
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        run: python scripts/fetch_universe.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Fetch prices
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        run: python scripts/fetch_prices.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Fetch fundamentals
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        # Retry rather than skip: a failed month cannot be recovered later.
        run: |
          for attempt in 1 2 3; do
            python scripts/fetch_fundamentals.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} && break
            echo "attempt $attempt failed, retrying in 120s"
            sleep 120
          done

      - name: Compute scores
        run: python scripts/compute_scores.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }}

      - name: Build site payloads
        run: python scripts/build_json.py

      - name: Split-handling acceptance test
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        run: python scripts/test_split_handling.py

      - name: Commit data
        # A capped run is a validation run: it proves the credentials and the
        # pipeline work, and must not publish a partial universe.
        if: ${{ !inputs.limit }}
        run: |
          git config user.name  "rankfield-bot"
          git config user.email "actions@github.com"
          # The companyfacts cache is regenerable and enormous; never commit it.
          git add data/ site/public/data/ ':!data/.cache'
          git commit -m "Monthly scores $(date -u +%Y-%m)" || echo "nothing to commit"
          git push
