name: Monthly score

# Scoring date is the last trading day of the prior month; the run happens a
# day or two later to give the sources time to settle.
#
# A missed month is a permanent hole in history - there is no external source to
# reconstruct past Rankfield scores from - so this job is built to survive a
# missed trigger:
#
#   * GitHub's scheduled runs are best effort. On 2026-10-02 the 06:00 trigger
#     simply never fired - no run, no failure, nothing to retry. Runs on the
#     hour are the most likely to be dropped, so every attempt below sits on an
#     odd minute.
#   * The month must land on the 2nd, so all seven attempts are on the 2nd,
#     spread from early morning to late evening UTC. The first one that runs
#     does the work; the rest find the month's record already committed and
#     stop in a second, so seven triggers still produce exactly one record.
#   * Seven independent chances in one day make a lost month effectively
#     impossible: every one of them would have to be dropped. If that happened,
#     the last attempt reports it, and the weekly job - a different schedule on
#     a different day - checks for the record and reports if it is missing.
#
# This workflow deploys the site itself when it is done: a push made with the
# built-in token never triggers another workflow.
on:
  schedule:
    # Seven attempts, all on the 2nd, none on a round minute.
    - cron: "17 5 2 * *"
    - cron: "23 7 2 * *"
    - cron: "41 9 2 * *"
    - cron: "07 12 2 * *"
    - cron: "33 15 2 * *"
    - cron: "49 18 2 * *"
    - cron: "11 22 2 * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Scoring date override (YYYY-MM-DD)"
        required: false
      limit:
        # Keep this short: GitHub renders the description as the field's only
        # label, so a long one reads as body text and the input looks unlabelled.
        description: "Limit — cap universe size (validation run, skips the data commit)"
        required: false
        default: ""

concurrency:
  group: rankfield-score
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # the data-drift report opens an issue when there is something to review

jobs:
  # Is this month's record already in the repo? Four scheduled attempts must
  # produce one month, not four. A manual run always proceeds - that is the
  # point of asking for it.
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.look.outputs.needed }}
      month: ${{ steps.look.outputs.month }}
    steps:
      - uses: actions/checkout@v4
      - id: look
        run: |
          month=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          echo "month=$month" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run: proceeding whatever is on disk"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ -f "data/history/scores_$month.json" ]; then
            echo "$month is already recorded; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$month is missing; scoring it."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            # The last attempt of the day finding the month still missing means
            # every earlier trigger was dropped. Worth knowing even though this
            # run is about to fix it.
            if [ "$(date -u +%H)" -ge 22 ]; then
              echo "late=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Say so if this is the last scheduled attempt
        # Reaching the 5th with the month still missing means the first three
        # triggers were dropped. The run below will still produce it, but the
        # near-miss is worth seeing.
        if: steps.look.outputs.late == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "Monthly run reached its last scheduled attempt (${{ steps.look.outputs.month }})"             --body "The scheduled runs on the 2nd, 3rd and 4th did not produce ${{ steps.look.outputs.month }}. The attempt on the 5th is scoring it now: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  score:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Scoring engine tests
        # History is append-only: a scoring bug that reaches it cannot be undone
        # by fixing the code later. Gate the run on the maths first.
        run: python -m pytest tests/ -q

      - name: Check the SEC contact secret
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        # Fail here with a clear message rather than 40 minutes later with an
        # opaque EDGAR rejection. The value itself is never printed.
        run: |
          if [ -z "$RANKFIELD_USER_AGENT" ]; then
            echo "::error::RANKFIELD_USER_AGENT repository secret is not set. SEC policy requires a User-Agent carrying a real name and email address."
            exit 1
          fi
          case "$RANKFIELD_USER_AGENT" in
            *@*.*) echo "SEC contact is configured and contains an email address (value masked).";;
            *) echo "::error::RANKFIELD_USER_AGENT must contain an email address."; exit 1;;
          esac

      # SEC policy requires a User-Agent carrying a real name and email.
      # Set the RANKFIELD_USER_AGENT repository secret before the first run.
      - name: Fetch universe
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        shell: bash                     # pipefail, so tee cannot hide a failure
        run: python scripts/fetch_universe.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Fetch prices
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        shell: bash
        run: python scripts/fetch_prices.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Fetch fundamentals
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        # Retry rather than skip: a failed month cannot be recovered later.
        run: |
          for attempt in 1 2 3; do
            python scripts/fetch_fundamentals.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} 2>&1 | tee -a "$RUNNER_TEMP/run.log" && break
            echo "attempt $attempt failed, retrying in 120s"
            sleep 120
          done

      - name: Compute scores
        shell: bash
        run: python scripts/compute_scores.py ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Build site payloads
        shell: bash
        run: python scripts/build_json.py 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Split-handling acceptance test
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        shell: bash
        run: python scripts/test_split_handling.py 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Data drift check
        id: drift
        # Companies move figures to XBRL tags the pipeline does not read (~3
        # inputs a month). A small loss opens an issue and still publishes; a
        # collapse of the scored universe (usually a taxonomy change) fails here,
        # so nothing below runs and nothing is committed.
        shell: bash
        run: python scripts/check_drift.py --issue-body "$RUNNER_TEMP/drift_issue.md" 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Open a drift issue
        if: ${{ always() && !inputs.limit && (steps.drift.outputs.status == 'warn' || steps.drift.outputs.status == 'block') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Data drift: $(date -u +%Y-%m) scoring run (${{ steps.drift.outputs.status }})" \
            --body-file "$RUNNER_TEMP/drift_issue.md"

      - name: Commit data
        # A capped run is a validation run: it proves the credentials and the
        # pipeline work, and must not publish a partial universe.
        if: ${{ !inputs.limit }}
        run: |
          git config user.name  "rankfield-bot"
          git config user.email "actions@github.com"
          # The companyfacts cache is regenerable and enormous, and .gitignore
          # already keeps it out. Naming it here as an exclude pathspec made git
          # refuse the whole `add` - "the following paths are ignored" - and the
          # step exited 1, which is what failed the first weekly run (2026-09-26).
          git add data/ site/public/data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Monthly scores $(date -u +%Y-%m)"
            git push
          fi


      - name: Report a failure as an issue
        # A scheduled run has nobody watching it, and its log needs repository
        # admin to read. So a failure files its own report, with the tail of the
        # output, in a place anyone can see (2026-09-27).
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The **${{ github.workflow }}** run failed."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Last 60 lines of the pipeline output:"
            echo
            echo '```'
            tail -60 "$RUNNER_TEMP/run.log" 2>/dev/null || echo "(the failure happened before any output was captured)"
            echo '```'
          } > "$RUNNER_TEMP/failure.md"
          gh issue create             --title "${{ github.workflow }} failed: $(date -u +%Y-%m-%d)"             --body-file "$RUNNER_TEMP/failure.md"

  # A push from this job cannot trigger the deploy (see deploy-site.yml), so the
  # deploy is called here instead. Without it the data lands in the repo and the
  # live site keeps serving the previous payload.
  publish:
    needs: score
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
