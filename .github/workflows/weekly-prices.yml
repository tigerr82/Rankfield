name: Weekly prices

# Prices only - no fundamentals, no re-scoring. This keeps the price and
# month-over-month columns current between monthly runs at no extra cost.
#
# It deliberately does NOT write to data/history/: scores belong to their
# scoring date, and refreshing a price must never silently restate a stored
# monthly record.
on:
  schedule:
    - cron: "0 7 * * 6"
  workflow_dispatch:

concurrency:
  group: rankfield-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh prices
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        run: python scripts/fetch_prices.py

      - name: Commit
        run: |
          git config user.name  "rankfield-bot"
          git config user.email "actions@github.com"
          git add data/price_snapshot.json
          git commit -m "Weekly price refresh $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
