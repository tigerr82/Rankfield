name: Weekly price adjustment

# Prices only - no fundamentals, no new history record.
#
# This does NOT show newer prices. Every price on the site is the close on the
# scoring date, and the site only moves to a new price date at the monthly run.
# What this job keeps current is the adjustment: after a split or a dividend,
# that same close is restated on today's adjusted basis, so the dollar figure
# stays consistent with what a broker shows for that date. It rebuilds the
# display payloads as well as the snapshot, because scores_full.json is the
# file the site actually reads.
#
# `--no-history` is load-bearing. Scores belong to their scoring date, and this
# job must never create a month's record - if it ran before that month's
# scoring run, which happens whenever the 1st falls on a Saturday, it would
# write a record built on fresh prices and stale fundamentals, and append-only
# means the real run could never correct it.
on:
  schedule:
    - cron: "0 7 * * 6"
  workflow_dispatch:

concurrency:
  group: rankfield-prices
  cancel-in-progress: true

permissions:
  contents: write
  issues: write   # a failed run files its own report; see the last step

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Scoring engine tests
        run: python -m pytest tests/ -q

      - name: Refresh prices
        shell: bash                     # pipefail, so tee cannot hide a failure
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        run: python scripts/fetch_prices.py 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Rebuild the display payloads (history untouched)
        shell: bash
        run: |
          python scripts/compute_scores.py --no-history 2>&1 | tee -a "$RUNNER_TEMP/run.log"
          python scripts/build_json.py 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: Confirm no history record was written or altered
        run: |
          if ! git diff --quiet -- data/history/; then
            echo "::error::The weekly refresh modified data/history/. It must never do that."
            git --no-pager diff --stat -- data/history/
            exit 1
          fi
          echo "data/history/ untouched, as required."

      - name: Commit
        run: |
          git config user.name  "rankfield-bot"
          git config user.email "actions@github.com"
          # .gitignore already keeps data/.cache out. Naming it as an exclude
          # pathspec made git refuse the whole `add` and exit 1, which failed the
          # first scheduled run (2026-09-26).
          git add data/ site/public/data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Weekly price refresh $(date -u +%Y-%m-%d)"
            git push
          fi


      - name: Report a failure as an issue
        # A scheduled run has nobody watching it, and its log needs repository
        # admin to read. So a failure files its own report, with the tail of the
        # output, in a place anyone can see (2026-09-27).
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The **${{ github.workflow }}** run failed."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Last 60 lines of the pipeline output:"
            echo
            echo '```'
            tail -60 "$RUNNER_TEMP/run.log" 2>/dev/null || echo "(the failure happened before any output was captured)"
            echo '```'
          } > "$RUNNER_TEMP/failure.md"
          gh issue create             --title "${{ github.workflow }} failed: $(date -u +%Y-%m-%d)"             --body-file "$RUNNER_TEMP/failure.md"

  # A push from this job cannot trigger the deploy (see deploy-site.yml), so the
  # deploy is called here instead. Without it the data lands in the repo and the
  # live site keeps serving the previous payload.
  publish:
    needs: prices
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
