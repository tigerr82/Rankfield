name: Weekly price adjustment

# Prices only - no fundamentals, no new history record.
#
# This does NOT show newer prices. Every price on the site is the close on the
# scoring date, and the site only moves to a new price date at the monthly run.
# What this job keeps current is the adjustment: after a split or a dividend,
# that same close is restated on today's adjusted basis, so the dollar figure
# stays consistent with what a broker shows for that date. It rebuilds the
# display payloads as well as the snapshot, because scores_full.json is the
# file the site actually reads.
#
# `--no-history` is load-bearing. Scores belong to their scoring date, and this
# job must never create a month's record - if it ran before that month's
# scoring run, which happens whenever the 1st falls on a Saturday, it would
# write a record built on fresh prices and stale fundamentals, and append-only
# means the real run could never correct it.
on:
  schedule:
    - cron: "0 7 * * 6"
  workflow_dispatch:

concurrency:
  group: rankfield-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Scoring engine tests
        run: python -m pytest tests/ -q

      - name: Refresh prices
        env:
          RANKFIELD_USER_AGENT: ${{ secrets.RANKFIELD_USER_AGENT }}
        run: python scripts/fetch_prices.py

      - name: Rebuild the display payloads (history untouched)
        run: |
          python scripts/compute_scores.py --no-history
          python scripts/build_json.py

      - name: Confirm no history record was written or altered
        run: |
          if ! git diff --quiet -- data/history/; then
            echo "::error::The weekly refresh modified data/history/. It must never do that."
            git --no-pager diff --stat -- data/history/
            exit 1
          fi
          echo "data/history/ untouched, as required."

      - name: Commit
        run: |
          git config user.name  "rankfield-bot"
          git config user.email "actions@github.com"
          git add data/ site/public/data/ ':!data/.cache'
          git commit -m "Weekly price refresh $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
